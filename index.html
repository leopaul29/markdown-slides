<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Turn any Markdown document into a beautiful, navigable HTML presentation."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%236ea8fe'/%3E%3Cpath d='M5 8h4l3 4 3-4h4M5 8v8m14-8v8' stroke='%230b0e14' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E"
    />
    <title>Markdown Reader</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      try {
        const stored = localStorage.getItem('markdown-reader:theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.dataset.theme = 'light'
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
